services:
  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Retains Chroma's indexed videos across container restarts and deploys.
      - ./backend/data:/app/backend/data
    restart: unless-stopped

  # Optional HTTPS reverse proxy. Start with: docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

